{% extends "base.html" %}

{% block header %} 
{% include "header.html" %}
{% endblock %}

{% block content %}
        <h1>학생 리스트</h1>
        <hr>
        <section id="tables">
        <h2>Tables</h2>
            <div class="overflow-auto">
                <table class="striped">
                    <thead>
                        <th>no</th>
                        <th>name</th>
                    </thead>
                    <tbody>
                        {% for student in students %}
                            <tr>
                                <td>{{ loop.index }}</td>
                                <td>{{ student }}</td>
                            </tr>
                        {% else %}
                            <tr>
                                <td colspan='2'>학생이 없습니다.</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>
{% endblock %}
