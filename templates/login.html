{% extends "base.html" %}
{% block title %}로그인{% endblock %}

{% block content %}
<section class="card login-card">
    <h1>FireCar 관제</h1>
    <p class="muted">자율주행 소방 RC카 관제 시스템</p>

    {% if bypass %}
    <div class="alert warning small">개발 모드: 아무 아이디/비밀번호로 로그인됩니다.</div>
    {% endif %}

    {% if error %}
    <div class="alert error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
        <label for="login_id">아이디</label>
        <input type="text" id="login_id" name="login_id" value="{{ login_id }}" {{ '' if bypass else 'required' }} autofocus>

        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" {{ '' if bypass else 'required' }}>

        <button type="submit" class="btn primary block">로그인</button>
    </form>
</section>
{% endblock %}
