{% extends "base.html" %}

{% block header %} 
{% include "header.html" %}
{% endblock %}

{% block content %}
<div style="max-width: 700px; height: 400px; margin: 2rem auto;">
    <canvas id = "myChart"></canvas>
</div>
<div>
    <img id='toggle' src="{{ url_for('static', filename='img/on.png') }}" style='width:100px; height:46px;' onclick="toggle()"/>
</div>    

{% endblock %}

{% block footer %}
{% include "footer.html" %}
{% endblock %}

{% block script %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('myChart');

    
    const labels = {{ labels | tojson }};
    const data = {{ data | tojson }};
    const title = {{ title | tojson }};

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: title,
                data: data,
                backgroundColor: [
                    'rgba(255, 99, 132, 0.2)',
                    'rgba(54, 162, 235, 0.2)',
                    'rgba(255, 206, 86, 0.2)',
                    'rgba(75, 192, 192, 0.2)',
                    'rgba(153, 102, 255, 0.2)',
                    'rgba(255, 159, 64, 0.2)'
                ],
                borderColor: [
                    'rgba(255, 99, 132, 1)',
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(75, 192, 192, 1)',
                    'rgba(153, 102, 255, 1)',
                    'rgba(255, 159, 64, 1)'
                ],
                borderWidth: 1
            }]
        },
        options: {
            maintainAspectRatio: false
        }
    });
        let isOn = true;
        function toggle() {
            const buttonImg = document.getElementById('toggle');

            if (isOn) {
                buttonImg.src = "{{ url_for('static', filename='img/off.png') }}";
            } else {
                buttonImg.src = "{{ url_for('static', filename='img/on.png') }}";
            }
            isOn = !isOn;

           fetch ('http://172.20.1.86:8000/led?command=${isOn}',
                {method : "POST"})
                .then(response => response.json())
                .then(data => {console.log(data);})
                .catch(error => {
                    console.error(error)});
            };

            if (response.ok) {
                
            }

           
    }
</script>
{% endblock %}
