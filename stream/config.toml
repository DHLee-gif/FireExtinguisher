# 영상을 받을 웹앱 서버 주소 (WebSocket). 실제 웹앱이 생기면 이 줄만 바꾼다.
# 시험용 가상 서버: stream/dev_server.py (기본 포트 8090)
server_url = "ws://127.0.0.1:8090/ingest"

# 웹앱이 요구하면 넣는다. 비어 있으면 보내지 않는다. ("Authorization: Bearer <token>")
token = ""

# 이 차를 구분하는 이름 (웹앱에 처음 연결할 때 보낸다)
car_id = "firecar-1"

# 보낼 영상 크기 (가로 픽셀). 카메라 영상보다 크면 카메라 크기 그대로. 작을수록 가볍다.
width = 640

# 초당 보낼 장수. 화면 보기에는 10장이면 충분하다 (우선순위 가장 낮음). docs/timing.md
fps = 10

# JPEG 화질 (1~100). 낮을수록 가볍고 흐리다.
jpeg_quality = 70

# 이보다 오래된 영상(초)은 보내지 않는다 (카메라가 멈춘 것)
max_frame_age_s = 0.5

# 서버 연결이 끊기면 다시 연결하기까지 기다리는 시간(초). 실패가 이어지면 최대값까지 늘린다.
reconnect_min_s = 1.0
reconnect_max_s = 10.0

# 한 장을 보내는 데 이보다 오래 걸리면(초) 연결이 죽은 것으로 보고 다시 연결한다
send_timeout_s = 5.0
